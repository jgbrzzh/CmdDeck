name: Windows build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "构建安装包的明确版本号（例如 1.1.0）；留空只检查"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Check project; package explicit versions
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate requested installer version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          $requested = $env:REQUESTED_VERSION.Trim()
          if ($requested.StartsWith('v')) { $requested = $requested.Substring(1) }
          if ($requested -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Specify an explicit version such as 1.1.0' }
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $config = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($requested -ne $package -or $requested -ne $config -or $requested -ne $cargo) { throw 'Requested version must match package.json, Cargo.toml and tauri.conf.json' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Rust stable (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-rust-
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and frontend build
        run: npm run build
      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -j 2
      - name: Build Windows installers
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        run: ./scripts/Build.ps1 -Target all
      - name: Collect installers and SHA256
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.msi' -and $_.Name -like "CmdDeck_${version}_*" } |
            Copy-Item -Destination artifacts
          $files = Get-ChildItem artifacts -File
          if ($files.Count -lt 2) { throw 'Missing EXE or MSI installer' }
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Copy-Item LICENSE artifacts/LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          name: CmdDeck-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CmdDeck-windows-x64
          path: artifacts
      - name: Create release with installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --title "CmdDeck $env:RELEASE_TAG" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
