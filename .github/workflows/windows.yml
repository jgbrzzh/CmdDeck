name: Windows build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Check and build EXE + MSI
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Rust stable (MSVC)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and frontend build
        run: npm run build
      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -j 2
      - name: Build Windows installers
        shell: pwsh
        run: ./scripts/Build.ps1 -Target all
      - name: Collect installers and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.msi' } |
            Copy-Item -Destination artifacts
          $files = Get-ChildItem artifacts -File
          if ($files.Count -lt 2) { throw 'Missing EXE or MSI installer' }
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Copy-Item LICENSE artifacts/LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CmdDeck-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CmdDeck-windows-x64
          path: artifacts
      - name: Create release with installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --title "CmdDeck $env:RELEASE_TAG" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
